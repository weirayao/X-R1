# This is X-R1(https://github.com/dhcode-cpp/X-R1) project training config:
# required >=  16 x 40G GPU
# running time ~32h
wandb_project: ccplus-qwen-7b-instruct-1m
run_name: Qwen2.5-7B-Instruct-1M_t_06_e_2_ccplus

# Model arguments
model_name_or_path: /home/skokane/rl/X-R1/output/qwen_ccplus_1m/e_1/checkpoint-89/
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: dummy/dummy # This is not used; we preprocess the data before training
train_dataset_file: /home/skokane/data/ccplus_python/code-r1-5k-codecontests_plus/train_*.parquet
test_dataset_file: /home/skokane/data/ccplus_python/code-r1-5k-codecontests_plus/test_*.parquet

num_processes: 7

# Reward functions
reward_funcs: ["accuracy"]
# reward_weights: [1.0, 1.0]
# GRPO trainer config
use_vllm: true
output_dir: output/qwen_ccplus_1m/e_2/
gradient_accumulation_steps: 4
max_prompt_length: 4096
num_generations: 4
max_completion_length: 4096

bf16: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.7
vllm_max_model_len: 4096
temperature: 0.6
do_eval: true
eval_strategy: "steps" # "no", "steps", "epoch"
eval_steps: 25

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 2.5e-06
beta: 0.001 # without KL
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine
max_steps: -1
num_train_epochs: 1
overwrite_output_dir: true
per_device_eval_batch_size: 16
per_device_train_batch_size: 4
push_to_hub: False
report_to:
- wandb

save_strategy: "epoch"
resume_from_checkpoint: False #/home/skokane/rl/X-R1/output/coder1/e_less_1/checkpoint-110/
seed: 42
warmup_ratio: 0.1