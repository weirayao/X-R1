# GRPO trainer config
use_vllm: true
output_dir: output/qwen_distill_7b_ccplus_t06/e_1/
gradient_accumulation_steps: 4
max_prompt_length: 4096
num_generations: 4
max_completion_length: 4096

bf16: true
