# This is X-R1(https://github.com/dhcode-cpp/X-R1) project training config:
# required >=  16 x 40G GPU
# running time ~32h
wandb_project: coder1-qwen-7b-instruct
run_name: Distill-Qwen-7b-original

# Model arguments
model_name_or_path: /home/skokane/models/models--deepseek-ai--DeepSeek-R1-Distill-Qwen-7B/snapshots/14dd1130311655b43c3ce41dd505f70f6ca89845/
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: dummy/dummy # This is not used; we preprocess the data before training
train_dataset_file: /home/skokane/data/code-r1-12k-leetcode2k-taco/code-r1-12k-leetcode2k-taco/train_DeepSeek-R1-Distill-Qwen-7B.parquet
test_dataset_file: /home/skokane/data/code-r1-12k-leetcode2k-taco/code-r1-12k-leetcode2k-taco/test_DeepSeek-R1-Distill-Qwen-7B.parquet

num_processes: 8

# Reward functions
reward_funcs: ["accuracy"]
